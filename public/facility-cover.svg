<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Facility with no photo">
  <!--
    The default facility photo (DEV-257).

    Same family as announcement-cover.svg — identical ground and hairlines, so
    an empty card in either list reads as the same kind of absence — but a
    different motif, because a notice and a swimming pool should not be drawn
    the same way. A pavilion over water covers what strata amenities actually
    are: pool, gym, hall, BBQ pit, surau.

    Drawn large on purpose. object-cover crops this into a 64px tile on the
    facility card, and a delicate illustration turns to grey mush at that size.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b2c"/>
      <stop offset="1" stop-color="#0c1324"/>
    </linearGradient>
    <pattern id="hair" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#d0bcff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#hair)"/>

  <!-- the pavilion -->
  <g>
    <!-- roof -->
    <path d="M320 70 L470 142 H170 Z" fill="#2c3448" stroke="#d0bcff" stroke-opacity="0.5" stroke-width="3" stroke-linejoin="round"/>
    <rect x="166" y="142" width="308" height="14" rx="5" fill="#2c3448" stroke="#d0bcff" stroke-opacity="0.42"/>
    <!-- columns -->
    <rect x="196" y="156" width="20" height="86" rx="4" fill="#2c3448" stroke="#d0bcff" stroke-opacity="0.36"/>
    <rect x="310" y="156" width="20" height="86" rx="4" fill="#2c3448" stroke="#d0bcff" stroke-opacity="0.36"/>
    <rect x="424" y="156" width="20" height="86" rx="4" fill="#2c3448" stroke="#d0bcff" stroke-opacity="0.36"/>
    <!-- deck -->
    <rect x="178" y="242" width="284" height="12" rx="5" fill="#2c3448" stroke="#d0bcff" stroke-opacity="0.4"/>
  </g>

  <!-- water -->
  <g stroke="#d0bcff" stroke-linecap="round" fill="none">
    <path d="M150 284 q22 -13 44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0" stroke-opacity="0.42" stroke-width="9"/>
    <path d="M172 312 q22 -13 44 0 t44 0 t44 0 t44 0 t44 0 t44 0" stroke-opacity="0.24" stroke-width="9"/>
  </g>
</svg>
