<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Notice with no image">
  <!--
    The default announcement cover (DEV-255).

    Most notices are posted without a photo, so this stands in for one. Two
    constraints shaped it. It is quiet, because a placeholder that competes
    with the headline is worse than no image at all. And the motif is large,
    because the same file is cropped by object-cover into a 64x44 table
    thumbnail - a delicate illustration turns to grey mush at that size.
    Obsidian surfaces only, the accent at low opacity.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b2c"/>
      <stop offset="1" stop-color="#0c1324"/>
    </linearGradient>
    <pattern id="hair" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#d0bcff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#hair)"/>

  <!-- the pinned sheet, off-square so it reads as paper rather than a panel -->
  <g transform="rotate(-1.4 320 190)">
    <rect x="176" y="76" width="288" height="224" rx="12" fill="#232a3c" stroke="#d0bcff" stroke-opacity="0.34"/>
    <rect x="208" y="126" width="168" height="15" rx="7.5" fill="#d0bcff" fill-opacity="0.52"/>
    <rect x="208" y="166" width="224" height="11" rx="5.5" fill="#cbd5e1" fill-opacity="0.26"/>
    <rect x="208" y="196" width="224" height="11" rx="5.5" fill="#cbd5e1" fill-opacity="0.26"/>
    <rect x="208" y="226" width="152" height="11" rx="5.5" fill="#cbd5e1" fill-opacity="0.26"/>
    <rect x="208" y="262" width="88" height="11" rx="5.5" fill="#cbd5e1" fill-opacity="0.14"/>
  </g>

  <!-- the pin -->
  <circle cx="320" cy="76" r="17" fill="#0c1324" stroke="#d0bcff" stroke-opacity="0.5"/>
  <circle cx="320" cy="76" r="7" fill="#d0bcff" fill-opacity="0.8"/>
</svg>
